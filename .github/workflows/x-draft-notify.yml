name: X Draft Notify

on:
  schedule:
    # JST 21:00
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-draft:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh ranking data
        run: python generate_x_ranking.py

      - name: Validate Discord webhook env
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret."
            exit 1
          fi

      - name: Send X draft notification
        run: python scripts/send_x_draft_notification.py
