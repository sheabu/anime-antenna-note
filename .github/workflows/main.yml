name: Auto Post X Ranking

on:
  schedule:
    # JST 09:00 / 21:00
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Postせず内容だけ確認"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ENABLE_IMAGE: "false"
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build latest ranking snapshot
        run: python generate_x_ranking.py

      - name: Validate X credentials in env
        run: |
          missing=()
          [ -n "$X_API_KEY" ] || missing+=("X_API_KEY")
          [ -n "$X_API_SECRET" ] || missing+=("X_API_SECRET")
          [ -n "$X_ACCESS_TOKEN" ] || missing+=("X_ACCESS_TOKEN")
          [ -n "$X_ACCESS_TOKEN_SECRET" ] || missing+=("X_ACCESS_TOKEN_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required env vars: ${missing[*]}"
            echo "Check GitHub Secrets names in repository settings."
            exit 1
          fi

      - name: Post to X
        run: python scripts/post_x_update.py
