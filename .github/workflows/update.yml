name: Update Anime Notes DB

on:
  schedule:
    # 毎日 21:00 UTC = JST 翌朝 06:00
    - cron: "0 21 * * *"
  workflow_dispatch:   # 手動実行も可能

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: update-anime-notes-db
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print runtime clock
        run: |
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S')"
          TZ=Asia/Tokyo date '+JST now: %Y-%m-%d %H:%M:%S'

      - name: Run full data pipeline
        run: |
          python scraper.py
          python detail_scraper.py
          python clean_data.py
          python generate_x_ranking.py

      - name: Commit and push updated data
        run: |
          git checkout main
          git pull --rebase --autostash origin main
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anime_notes.db notes_data.json x_ranking.json
          if git diff --cached --quiet; then
            echo "No changes detected. Skip commit and push."
            exit 0
          fi
          TZ=Asia/Tokyo git commit -m "chore: auto update notes data [$(date '+%Y-%m-%d %H:%M JST')]"
          for attempt in 1 2 3; do
            echo "push attempt: $attempt"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            sleep 8
          done
          echo "Push failed after retries."
          exit 1
