name: Update Anime Notes DB

on:
  schedule:
    # 毎日 21:00 UTC = JST 翌朝 06:00
    - cron: "0 21 * * *"
  workflow_dispatch:   # 手動実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. リポジトリをチェックアウト ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 環境セットアップ ─────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. 依存ライブラリをインストール ────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # ── 4. スクレイパー実行 ────────────────────────────────────────────────
      - name: Run scraper
        run: python scraper.py
        working-directory: .   # anime-antenna/ ルートで実行

      # ── 5. DBからフロントエンド用JSONを再生成（scraper.py内で実行済み） ──
      #    scraper.py が notes_data.json を自動生成するため追加処理不要

      # ── 6. 更新されたファイルをコミット ────────────────────────────────────
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anime_notes.db notes_data.json
          # 変更がなければスキップ
          git diff --cached --quiet || git commit -m "chore: auto update notes data [$(date '+%Y-%m-%d %H:%M JST' -d '+9 hours')]"
          git push

      # ── 7. GitHub Pages へデプロイ ─────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."   # index.html がルートに存在する想定

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
