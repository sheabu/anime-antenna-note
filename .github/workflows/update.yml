name: Update Anime Notes DB

on:
  schedule:
    # 毎日 21:00 UTC = JST 翌朝 06:00
    - cron: "0 21 * * *"
  workflow_dispatch:   # 手動実行も可能

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full data pipeline
        run: |
          python scraper.py
          python detail_scraper.py
          python clean_data.py
          python generate_x_ranking.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anime_notes.db notes_data.json x_ranking.json
          # 変更がなければスキップ
          git diff --cached --quiet || git commit -m "chore: auto update notes data [$(date '+%Y-%m-%d %H:%M JST' -d '+9 hours')]"
          git push
