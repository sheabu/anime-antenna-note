<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アニメnoteアンテナ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><img src="logo.png" alt="ロゴ" style="height: 40px;"></a>
            <input type="text" id="search-input" class="form-control w-50" placeholder="記事を検索...">
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <main class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0 fw-bold text-secondary">新着・人気記事</h2>
                    <span id="result-count" class="badge bg-secondary">0件</span>
                </div>
                <div id="note-list">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">データを読み込み中...</p>
                    </div>
                </div>
            </main>

            <aside class="col-lg-4">
                <div class="sticky-top" style="top: 20px;">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body">
                            <h5 class="card-title fw-bold h6 mb-3">作品から探す</h5>
                            <select id="anime-filter" class="form-select mb-3">
                                <option value="">すべての作品</option>
                            </select>
                            
                            <h5 class="card-title fw-bold h6 mb-3">並び替え</h5>
                            <select id="sort-order" class="form-select">
                                <option value="likes">人気順（スキ数）</option>
                                <option value="new">新着順</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title fw-bold h6 mb-2">このサイトについて</h5>
                            <p class="small text-muted mb-0">noteのアニメ感想記事を自動収集してランキング形式で紹介しています。</p>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
