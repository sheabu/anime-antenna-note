<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにnoteアンテナ | アニメ感想まとめ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1 class="logo">あにnoteアンテナ</h1>
            <input type="text" id="search-input" placeholder="作品名やキーワードで検索...">
        </div>
    </header>

    <div class="container">
        <main>
            <div class="main-header">
                <h2>新着・人気記事</h2>
                <span id="result-count">0 articles</span>
            </div>
            <div id="note-list">
                </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel work-panel">
                <h3>🔍 作品から探す</h3>
                <select id="work-filter">
                    <option value="all">すべての作品</option>
                </select>
            </div>

            <div class="sidebar-panel sort-panel">
                <h3>🔃 並び替え</h3>
                <select id="sort-order">
                    <option value="new">新着順</option>
                    <option value="popular">人気順（スキ数）</option>
                </select>
            </div>

            <div class="sidebar-panel x-panel">
                <h3>📢 公式X 最新情報</h3>
                <div class="x-window">
                    <div class="x-scroller">
                        <a class="twitter-timeline" 
                           data-chrome="noheader nofooter noborders transparent" 
                           data-height="1000" 
                           href="https://twitter.com/anime_antenna_">
                           Loading...
                        </a>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
