<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにnoteアンテナ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1 class="logo">あにnoteアンテナ</h1>
            <input type="text" id="search-input" placeholder="キーワードで探す...">
        </div>
    </header>

    <div class="container">
        <main>
            <div id="note-list">データを読み込んでいます...</div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel">
                <label>作品絞り込み</label>
                <select id="work-filter"><option value="all">すべての作品</option></select>
            </div>
            <div class="sidebar-panel">
                <label>並び替え</label>
                <select id="sort-order">
                    <option value="new">新着順</option>
                    <option value="popular">人気順</option>
                </select>
            </div>
            <div class="sidebar-panel x-ad-space">
                <div class="x-ad-header">OFFICIAL X NEWS</div>
                <div class="x-ticker" aria-label="Xニュースティッカー">
                    <div class="x-ticker-track" id="x-news-ticker-track">
                        <a href="https://twitter.com/animesien" target="_blank" rel="noopener noreferrer">@animesien 最新ポスト</a>
                        <a href="https://twitter.com/hashtag/%E3%82%A2%E3%83%8B%E3%83%A1?f=live" target="_blank" rel="noopener noreferrer">#アニメ ライブ投稿</a>
                        <a href="https://twitter.com/hashtag/%E8%91%AC%E9%80%81%E3%81%AE%E3%83%95%E3%83%AA%E3%83%BC%E3%83%AC%E3%83%B3?f=live" target="_blank" rel="noopener noreferrer">#葬送のフリーレン</a>
                        <a href="https://twitter.com/hashtag/%E3%83%92%E3%83%AD%E3%82%A2%E3%82%AB?f=live" target="_blank" rel="noopener noreferrer">#ヒロアカ</a>
                    </div>
                </div>
                <div class="x-ad-window">
                    <a
                        class="twitter-timeline"
                        data-chrome="noheader nofooter noborders transparent"
                        data-width="100%"
                        data-height="560"
                        href="https://twitter.com/animesien?ref_src=twsrc%5Etfw"
                    >@animesien の投稿</a>
                </div>
                <div id="x-widget-fallback" class="x-fallback hidden">
                    <a href="https://twitter.com/animesien" target="_blank" rel="noopener noreferrer">@animesien を開く</a>
                    <span>・</span>
                    <a href="https://twitter.com/hashtag/%E3%82%A2%E3%83%8B%E3%83%A1?f=live" target="_blank" rel="noopener noreferrer">#アニメ を開く</a>
                </div>
            </div>
            <div class="sidebar-panel x-ad-space">
                <div class="x-ad-header">ANIME HASHTAG RANKING</div>
                <div class="x-rank-board">
                    <div class="x-rank-ticker">
                        <div class="x-rank-track" id="x-rank-track">
                            <span>#アニメランキング 読み込み中...</span>
                        </div>
                    </div>
                    <ol class="x-rank-list" id="x-rank-list"></ol>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
