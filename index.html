<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにnoteアンテナ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1 class="logo">あにnoteアンテナ</h1>
            <input type="text" id="search-input" placeholder="キーワードで探す...">
        </div>
    </header>

    <div class="container">
        <main>
            <div id="note-list">データを読み込んでいます...</div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel">
                <label>作品絞り込み</label>
                <select id="work-filter"><option value="all">すべての作品</option></select>
            </div>
            <div class="sidebar-panel">
                <label>並び替え</label>
                <select id="sort-order">
                    <option value="new">新着順</option>
                    <option value="popular">人気順</option>
                </select>
            </div>
            <div class="sidebar-panel x-ad-space">
                <div class="x-ad-header">OFFICIAL X NEWS</div>
                <div class="x-ad-window">
                    <a
                        class="twitter-timeline"
                        data-chrome="noheader nofooter noborders transparent"
                        data-height="560"
                        href="https://twitter.com/anime_antenna_?ref_src=twsrc%5Etfw"
                    >@anime_antenna_ の投稿</a>
                </div>
            </div>
            <div class="sidebar-panel x-ad-space">
                <div class="x-ad-header">HASHTAG STREAM</div>
                <div class="x-ad-window">
                    <a
                        class="twitter-timeline"
                        data-chrome="noheader nofooter noborders transparent"
                        data-height="560"
                        href="https://twitter.com/hashtag/%E3%82%A2%E3%83%8B%E3%83%A1?src=hashtag_click&f=live"
                    >#アニメ の投稿</a>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
