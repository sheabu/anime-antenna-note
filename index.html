<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにnoteアンテナ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <img src="logo.png" alt="あにnoteアンテナ" class="logo">
            <input type="text" id="search-input" placeholder="記事を検索...">
        </div>
    </header>

    <div class="container">
        <main>
            <h2 id="list-title">新着・人気記事</h2>
            <div id="note-list">
                </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel">
                <h3>作品から探す</h3>
                <select id="work-filter">
                    <option value="all">すべての作品</option>
                </select>
            </div>

            <div class="sidebar-panel">
                <h3>並び替え</h3>
                <select id="sort-order">
                    <option value="new">新着順</option>
                    <option value="popular">人気順（スキ数）</option>
                </select>
            </div>

            <div class="sidebar-panel x-panel">
                <h3>📢 公式X最新情報</h3>
                <div class="x-timeline-container">
                    <a class="twitter-timeline" data-height="500" href="https://twitter.com/anime_antenna_?ref_src=twsrc%5Etfw">Tweets by anime</a>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
