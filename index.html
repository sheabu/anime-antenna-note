<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにnoteアンテナ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <h1>あにnoteアンテナ</h1>
    </header>

    <div class="container">
        <main id="main-content">
            <nav class="sort-tabs">
                <button class="tab-btn active" onclick="sortNotes('new')">最新</button>
                <button class="tab-btn" onclick="sortNotes('popular')">人気</button>
                <button class="tab-btn" onclick="sortNotes('work')">作品別</button>
            </nav>
            
            <div id="note-list">
                </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel">
                <div class="panel-header">📢 公式X最新情報</div>
                <div class="x-embed-container">
                    <a class="twitter-timeline" data-height="600" data-theme="light" href="https://twitter.com/anime_antenna_?ref_src=twsrc%5Etfw">Tweets by anime</a> 
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
