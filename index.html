<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あにnoteアンテナ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1 class="logo">あにnoteアンテナ</h1>
            <input type="text" id="search-input" placeholder="記事を検索...">
        </div>
    </header>

    <div class="container">
        <main>
            <div id="note-list"></div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel">
                <h3>作品別</h3>
                <select id="work-filter"><option value="all">すべて</option></select>
            </div>
            <div class="sidebar-panel x-panel">
                <div class="x-header">OFFICIAL X NEWS</div>
                <div class="x-window">
                    <a class="twitter-timeline" data-chrome="noheader nofooter noborders transparent" data-height="1000" href="https://twitter.com/anime_antenna_"></a>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
