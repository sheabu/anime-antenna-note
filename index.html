<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにnoteアンテナ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-area">
                <img src="logo.png" alt="あにnoteアンテナ" class="logo">
                <span>あにnoteアンテナ</span>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="キーワードで記事を探す...">
            </div>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="main-header">
                <h2 id="list-title">新着・人気記事</h2>
                <span class="count-badge" id="article-count">0 articles</span>
            </div>
            <div id="note-list">
                </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel">
                <h3><i class="icon">📺</i> 作品から探す</h3>
                <select id="work-filter">
                    <option value="all">すべての作品</option>
                    </select>
            </div>

            <div class="sidebar-panel">
                <h3><i class="icon">🔃</i> 並び替え</h3>
                <select id="sort-order">
                    <option value="new">最新順</option>
                    <option value="popular">人気順（スキ数）</option>
                </select>
            </div>

            <div class="sidebar-panel x-panel">
                <h3><i class="icon">📢</i> 公式X ニュース</h3>
                <div class="x-train-window">
                    <div class="x-scroller" id="x-embed-area">
                        <a class="twitter-timeline" 
                           data-chrome="noheader nofooter noborders transparent" 
                           data-height="800" 
                           href="https://twitter.com/anime_antenna_">
                           読み込み中...
                        </a>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
