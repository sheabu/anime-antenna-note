<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あにnoteアンテナ | アニメ感想まとめ</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo">あにnoteアンテナ</div>
            <input type="text" id="search-input" placeholder="作品やキーワードで検索...">
        </div>
    </header>

    <div class="container">
        <main>
            <div class="list-info">
                <h2 id="list-title">新着・人気記事</h2>
                <span id="result-count">0 articles</span>
            </div>
            <div id="note-list">
                </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-panel">
                <h3>📺 作品から探す</h3>
                <select id="work-filter">
                    <option value="all">すべての作品</option>
                </select>
            </div>

            <div class="sidebar-panel">
                <h3>🔃 並び替え</h3>
                <select id="sort-order">
                    <option value="new">最新順</option>
                    <option value="popular">人気順（スキ数）</option>
                </select>
            </div>

            <div class="sidebar-panel x-panel">
                <div class="panel-header">📢 公式X トレインチャンネル</div>
                <div class="train-window">
                    <div class="x-content">
                        <a class="twitter-timeline" 
                           data-chrome="noheader nofooter noborders transparent" 
                           data-height="1200" 
                           href="https://twitter.com/anime_antenna_">
                           Loading...
                        </a>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
