<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アニメnoteアンテナ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .note-card img { height: 180px; object-fit: cover; width: 100%; background: #f3f4f6; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-teal-600">🚀 アニメnoteアンテナ</h1>
            <div class="flex flex-wrap items-center gap-3">
                <input type="text" id="search-input" placeholder="記事を検索..." class="border rounded px-4 py-2 text-sm w-48 focus:ring-2 focus:ring-teal-500 outline-none" oninput="applyFilters()">
                <select id="anime-filter" class="border rounded px-3 py-2 text-sm" onchange="applyFilters()">
                    <option value="all">すべての作品</option>
                </select>
                <select id="sort-order" class="border rounded px-3 py-2 text-sm" onchange="applyFilters()">
                    <option value="newest">新着順</option>
                    <option value="popular">人気順（スキ数）</option>
                </select>
            </div>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="status-bar" class="mb-6 flex justify-between items-center text-sm">
            <span class="text-gray-500 font-medium" id="count-display">読み込み中...</span>
            <span class="bg-teal-100 text-teal-700 px-3 py-1 rounded-full text-xs">データ毎日更新</span>
        </div>
        <div id="notes-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="skeleton h-64 rounded-lg"></div>
            <div class="skeleton h-64 rounded-lg"></div>
            <div class="skeleton h-64 rounded-lg"></div>
        </div>
    </main>
    <script>
        let allNotes = [];
        async function init() {
            try {
                const response = await fetch('notes_data.json');
                allNotes = await response.json();
                const animeTitles = [...new Set(allNotes.map(n => n.anime_title))].sort();
                const filterSelect = document.getElementById('anime-filter');
                animeTitles.forEach(title => {
                    if(title) {
                        const opt = document.createElement('option');
                        opt.value = title;
                        opt.textContent = title;
                        filterSelect.appendChild(opt);
                    }
                });
                applyFilters();
            } catch (e) {
                document.getElementById('count-display').textContent = "❌ データの読み込みに失敗しました。";
            }
        }
        function applyFilters() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const animeFilter = document.getElementById('anime-filter').value;
            const sortOrder = document.getElementById('sort-order').value;
            let filtered = allNotes.filter(n => {
                const matchesSearch = (n.note_title || '').toLowerCase().includes(searchText);
                const matchesAnime = animeFilter === 'all' || n.anime_title === animeFilter;
                return matchesSearch && matchesAnime;
            });
            if (sortOrder === 'popular') {
                filtered.sort((a, b) => (b.like_count || 0) - (a.like_count || 0));
            } else {
                filtered.sort((a, b) => new Date(b.posted_at || b.updated_at) - new Date(a.posted_at || a.updated_at));
            }
            render(filtered.slice(0, 100));
            document.getElementById('count-display').textContent = `${filtered.length} 件の記事が見つかりました`;
        }
        function render(notes) {
            const container = document.getElementById('notes-container');
            container.innerHTML = notes.map(note => `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col h-full">
                    <a href="${note.url}" target="_blank" class="block overflow-hidden">
                        <img src="${note.thumbnail || 'https://placehold.jp/24/cccccc/ffffff/400x300.png?text=No%20Image'}" 
                             class="hover:scale-105 transition-transform duration-500"
                             onerror="this.src='https://placehold.jp/24/cccccc/ffffff/400x300.png?text=No%20Image'">
                    </a>
                    <div class="p-5 flex-grow flex flex-col">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-[10px] font-bold tracking-wider uppercase text-teal-600 bg-teal-50 px-2 py-0.5 rounded">${note.anime_title}</span>
                        </div>
                        <h3 class="font-bold text-gray-800 mb-4 line-clamp-2 leading-snug flex-grow">${note.note_title || '記事タイトルを取得中...'}</h3>
                        <div class="flex justify-between items-center pt-4 border-t border-gray-50 mt-auto">
                            <span class="flex items-center gap-1 text-red-500 font-bold">❤️ ${(note.like_count || 0).toLocaleString()}</span>
                            <span class="text-xs text-gray-400">${(note.posted_at || '').split(' ')[0]}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
